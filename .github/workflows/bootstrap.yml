name: bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pastikan repo masih kosong
        run: |
          if [ -f package.json ]; then
            echo "package.json sudah ada, bootstrap dibatalkan."
            exit 1
          fi
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Secret EXPO_TOKEN belum diisi."
            exit 1
          fi

      - name: Buat proyek Expo
        run: |
          npx --yes create-expo-app@latest "$RUNNER_TEMP/scaffold" --template blank-typescript --no-install --yes
          rsync -a --ignore-existing --exclude ".git" "$RUNNER_TEMP/scaffold/" ./

      - name: Pasang dependensi
        run: npm install

      - name: Pasang pustaka Orbit
        run: |
          npx expo install expo-secure-store expo-file-system expo-media-library expo-clipboard expo-updates expo-video expo-audio react-native-webview
          npx expo install --fix

      - name: Hubungkan ke akun Expo
        run: npx --yes eas-cli@latest init --non-interactive --force

      - name: Atur konfigurasi aplikasi
        run: node scripts/patch-config.mjs

      - name: Simpan hasil ke repo
        run: |
          git config user.name "orbit-bot"
          git config user.email "orbit-bot@users.noreply.github.com"
          git add -A
          git commit -m "bootstrap: proyek Expo dasar"
          git push
